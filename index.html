<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ระบบ POS ร้านกาแฟ</title>
<style>
:root{--brown:#6F4E37;--brown-d:#3E2B21;--brown-l:#A9836A;--cream:#FBF8F4;--line:#E6DCD2;
--ink:#141210;--muted:#8A7E74;--ok:#2E7D52;--warn:#C8871B;--bad:#B3392F;--r:16px;--sh:0 2px 10px rgba(62,43,33,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"SF Pro Text","Noto Sans Thai",Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;overflow:hidden}
button,input,select{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none;color:inherit}
.app{display:flex;flex-direction:column;height:100vh}
header{background:var(--brown-d);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px}
header .logo{width:42px;height:42px;border-radius:12px;background:var(--brown);display:grid;place-items:center;font-size:23px}
header h1{font-size:18px;margin:0;font-weight:800;line-height:1.2}
header .sub{font-size:12px;color:#D8C7BA}
header .sp{flex:1}
header .clock{font-size:13px;color:#EADFD6;text-align:right;line-height:1.4}
nav{display:flex;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{padding:10px 18px;border-radius:999px;font-weight:700;color:var(--brown-d);white-space:nowrap;font-size:15px}
nav button.on{background:var(--brown);color:#fff}
nav button .b{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}
main{flex:1;overflow:hidden}
section.page{display:none;height:100%;overflow:auto;padding:14px}
section.page.on{display:block}
#page-pos.on{display:flex;padding:0}
.left{flex:1;overflow:auto;padding:14px}
.right{width:396px;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cats button{padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;color:var(--brown-d)}
.cats button.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px}
.mcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:1px solid var(--line);text-align:left}
.mcard:active{transform:scale(.97)}
.ph{height:104px;background:#F1E8E0;display:grid;place-items:center;font-size:44px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.mcard .bd{padding:9px 11px}
.mcard .nm{font-weight:800;font-size:15px;line-height:1.3;height:39px;overflow:hidden}
.mcard .pr{color:var(--brown);font-weight:800;margin-top:3px}
.cart-h{padding:12px 14px;border-bottom:1px solid var(--line)}
.mem{background:var(--cream);border:1px solid var(--line);border-radius:13px;padding:10px}
.mem .row{display:flex;gap:6px}
.mem .info{font-size:13px;margin-top:8px;line-height:1.5}
.stamps{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.stamp{width:21px;height:21px;border-radius:50%;border:2px solid var(--brown-l);display:grid;place-items:center;font-size:11px}
.stamp.f{background:var(--brown);border-color:var(--brown)}
.cart-b{flex:1;overflow:auto;padding:8px 12px}
.ci{display:flex;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ci .t{flex:1}.ci .n{font-weight:800;font-size:15px}
.ci .o{font-size:12px;color:var(--muted)}
.ci .p{font-weight:800;text-align:right;min-width:64px}
.qty{display:flex;align-items:center;gap:9px;margin-top:6px}
.qty button{width:31px;height:31px;border-radius:9px;background:#F0E7DF;font-weight:800;color:var(--brown-d)}
.cart-f{border-top:1px solid var(--line);padding:12px 14px;background:#fff}
.tot{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.tot.big{font-size:22px;font-weight:800;color:var(--brown-d);border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.tot.free{color:var(--ok);font-weight:800}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{padding:14px;border-radius:14px;font-weight:800;text-align:center;display:block}
.btn.cash{background:var(--brown);color:#fff}
.btn.qr{background:var(--brown-d);color:#fff}
.btn.gh{background:#fff;border:1px solid var(--line);color:var(--brown-d)}
.btn.dan{background:#FDECEA;color:var(--bad)}
.btn.sm{padding:9px 14px;border-radius:10px;font-size:14px}
.btn[disabled]{opacity:.38;pointer-events:none}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
h2.tt{font-size:20px;margin:2px 0 14px;font-weight:800;color:var(--brown-d)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{color:var(--muted);font-size:12px;font-weight:800}
td.r,th.r{text-align:right}
input,select{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff;width:100%}
label.f{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:10px 0 5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800}
.pill.ok{background:#E6F3EC;color:var(--ok)}.pill.warn{background:#FCF0DC;color:var(--warn)}.pill.bad{background:#FBE9E7;color:var(--bad)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;margin-bottom:14px}
.kpi .k{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.kpi .k .l{font-size:12px;color:var(--muted);font-weight:800}
.kpi .k .v{font-size:24px;font-weight:800;color:var(--brown-d);margin-top:4px}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700}
.chip.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.chip.miss{border-color:#EFC4BE;color:var(--bad)}
.rowl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mask{position:fixed;inset:0;background:rgba(20,18,16,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.mask.on{display:flex}
.modal{background:var(--cream);border-radius:22px;width:100%;max-width:660px;max-height:93vh;overflow:auto}
.modal.wide{max-width:940px}
.modal .mh{position:sticky;top:0;background:var(--brown-d);color:#fff;padding:14px 18px;display:flex;align-items:center;z-index:2}
.modal .mh h3{margin:0;font-size:18px;flex:1}
.modal .mh button{color:#fff;font-size:27px;line-height:1}
.modal .mb{padding:16px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--brown-d);color:#fff;padding:13px 22px;border-radius:14px;font-weight:800;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;bottom:42px}
.slip{background:#fff;color:#000;font-size:13px;width:302px;margin:0 auto;padding:14px;border:1px solid var(--line);border-radius:10px}
.slip .c{text-align:center}.slip .b{font-weight:800}.slip .big{font-size:16px}
.slip .s{font-size:11px;color:#333}.slip .hr{border-top:1px dashed #000;margin:7px 0}
.slip .ln{display:flex;justify-content:space-between;gap:8px;margin:3px 0}
.qrbox{background:#fff;border-radius:16px;overflow:hidden;display:inline-block;width:330px;border:1px solid var(--line)}
.qrbox .hd{background:#003D6B;color:#fff;font-weight:800;padding:10px;letter-spacing:2px;font-size:15px}
.qrbox .bl{background:#0B4B84;padding:14px 0 18px}
.qrbox canvas{background:#fff;border-radius:6px;display:block;margin:0 auto}
canvas{max-width:100%}
@media(max-width:920px){.right{width:340px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">☕</div><div><h1 id="hName">ร้านกาแฟ</h1><div class="sub" id="hBranch">สาขา</div></div>
<div class="sp"></div><div class="clock" id="clock"></div></header>
<nav id="nav"></nav>
<main>
<section class="page on" id="page-pos">
  <div class="left"><div class="cats" id="cats"></div><div class="grid" id="menuGrid"></div></div>
  <div class="right">
    <div class="cart-h"><div class="mem">
      <div class="row"><input id="memPhone" type="tel" inputmode="numeric" placeholder="เบอร์สมาชิก เช่น 0812345678">
      <button class="btn cash sm" style="padding:10px 16px" onclick="findMember()">ค้นหา</button></div>
      <div class="info" id="memInfo"></div></div></div>
    <div class="cart-b" id="cartBody"></div>
    <div class="cart-f" id="cartFoot"></div>
  </div>
</section>
<section class="page" id="page-menu"></section>
<section class="page" id="page-stock"></section>
<section class="page" id="page-member"></section>
<section class="page" id="page-report"></section>
<section class="page" id="page-setting"></section>
</main></div>
<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
<div class="modal" id="modal"><div class="mh"><h3 id="mTitle"></h3><button onclick="closeModal()">×</button></div><div class="mb" id="mBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   QR CODE ENGINE  — ISO/IEC 18004 (byte mode, EC level M/L, ver 1-15)
   ================================================================== */
var QR=(function(){
 var EXP=[],LOG=[];
 for(var i=0;i<8;i++)EXP[i]=1<<i;
 for(var i=8;i<256;i++)EXP[i]=EXP[i-4]^EXP[i-5]^EXP[i-6]^EXP[i-8];
 for(var i=0;i<255;i++)LOG[EXP[i]]=i;
 function gexp(n){while(n<0)n+=255;while(n>=256)n-=255;return EXP[n];}
 function glog(n){return LOG[n];}

 function Poly(num,shift){
  var off=0;while(off<num.length&&num[off]===0)off++;
  this.num=[];
  for(var i=0;i<num.length-off;i++)this.num.push(num[i+off]);
  for(var j=0;j<(shift||0);j++)this.num.push(0);
 }
 Poly.prototype.get=function(i){return this.num[i];};
 Poly.prototype.len=function(){return this.num.length;};
 Poly.prototype.multiply=function(e){
  var num=[],i,j;
  for(i=0;i<this.len()+e.len()-1;i++)num[i]=0;
  for(i=0;i<this.len();i++)for(j=0;j<e.len();j++){
   var a=this.get(i),b=e.get(j);
   if(a===0||b===0)continue;
   num[i+j]^=gexp(glog(a)+glog(b));
  }
  return new Poly(num,0);
 };
 Poly.prototype.mod=function(e){
  if(this.len()-e.len()<0)return this;
  if(this.get(0)===0)return new Poly(this.num.slice(1),0).mod(e);
  var ratio=glog(this.get(0))-glog(e.get(0));
  var num=[],i;
  for(i=0;i<this.len();i++)num[i]=this.get(i);
  for(i=0;i<e.len();i++)num[i]^=gexp(glog(e.get(i))+ratio);
  return new Poly(num,0).mod(e);
 };
 function ecPoly(n){
  var a=new Poly([1],0);
  for(var i=0;i<n;i++)a=a.multiply(new Poly([1,gexp(i)],0));
  return a;
 }

 var ALIGN=[[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],
  [6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70]];
 var RSB={
  L:[[1,26,19],[1,44,34],[1,70,55],[1,100,80],[1,134,108],[2,86,68],[2,98,78],[2,121,97],
     [2,146,116],[2,86,68,2,87,69],[4,101,81],[2,116,92,2,117,93],[4,133,107],
     [3,145,115,1,146,116],[5,109,87,1,110,88]],
  M:[[1,26,16],[1,44,28],[1,70,44],[2,50,32],[2,67,43],[4,43,27],[4,49,31],[2,60,38,2,61,39],
     [3,58,36,2,59,37],[4,69,43,1,70,44],[1,80,50,4,81,51],[6,58,36,2,59,37],
     [8,59,37,1,60,38],[4,64,40,5,65,41],[5,65,41,5,66,42]]
 };
 var ECBIT={L:1,M:0};
 function blocksOf(ver,ec){
  var t=RSB[ec][ver-1],out=[];
  for(var i=0;i<t.length;i+=3)for(var j=0;j<t[i];j++)out.push({total:t[i+1],data:t[i+2]});
  return out;
 }
 function bchDigit(d){var n=0;while(d!==0){n++;d>>>=1;}return n;}
 function bchInfo(d){
  var v=d<<10;
  while(bchDigit(v)-bchDigit(1335)>=0)v^=(1335<<(bchDigit(v)-bchDigit(1335)));
  return ((d<<10)|v)^21522;
 }
 function bchVer(d){
  var v=d<<12;
  while(bchDigit(v)-bchDigit(7973)>=0)v^=(7973<<(bchDigit(v)-bchDigit(7973)));
  return (d<<12)|v;
 }
 function maskFn(p,i,j){
  switch(p){
   case 0:return (i+j)%2===0;
   case 1:return i%2===0;
   case 2:return j%3===0;
   case 3:return (i+j)%3===0;
   case 4:return (Math.floor(i/2)+Math.floor(j/3))%2===0;
   case 5:return (i*j)%2+(i*j)%3===0;
   case 6:return ((i*j)%2+(i*j)%3)%2===0;
   default:return ((i*j)%3+(i+j)%2)%2===0;
  }
 }
 function utf8(s){
  var o=[];
  for(var i=0;i<s.length;i++){
   var c=s.charCodeAt(i);
   if(c<0x80)o.push(c);
   else if(c<0x800)o.push(0xC0|(c>>6),0x80|(c&0x3F));
   else o.push(0xE0|(c>>12),0x80|((c>>6)&0x3F),0x80|(c&0x3F));
  }
  return o;
 }
 function createData(ver,ec,bytes){
  var blocks=blocksOf(ver,ec),buf=[],bl=0;
  function putBit(b){var k=Math.floor(bl/8);if(buf.length<=k)buf.push(0);if(b)buf[k]|=(0x80>>>(bl%8));bl++;}
  function put(num,len){for(var i=0;i<len;i++)putBit(((num>>>(len-i-1))&1)===1);}
  put(4,4);
  put(bytes.length,ver<10?8:16);
  for(var i=0;i<bytes.length;i++)put(bytes[i],8);
  var totalData=0;
  for(i=0;i<blocks.length;i++)totalData+=blocks[i].data;
  if(bl+4<=totalData*8)put(0,4);
  while(bl%8!==0)putBit(false);
  while(bl<totalData*8){put(0xEC,8);if(bl>=totalData*8)break;put(0x11,8);}
  while(buf.length<totalData)buf.push(0);
  /* interleave + reed-solomon */
  var dc=[],ecd=[],off=0,maxD=0,maxE=0;
  for(var r=0;r<blocks.length;r++){
   var dCount=blocks[r].data,eCount=blocks[r].total-dCount;
   maxD=Math.max(maxD,dCount);maxE=Math.max(maxE,eCount);
   dc[r]=[];
   for(i=0;i<dCount;i++)dc[r][i]=0xff&buf[i+off];
   off+=dCount;
   var rs=ecPoly(eCount);
   var raw=new Poly(dc[r],rs.len()-1);
   var md=raw.mod(rs);
   ecd[r]=[];
   for(i=0;i<rs.len()-1;i++){
    var idx=i+md.len()-(rs.len()-1);
    ecd[r][i]=(idx>=0)?md.get(idx):0;
   }
  }
  var total=0;
  for(i=0;i<blocks.length;i++)total+=blocks[i].total;
  var data=[];
  for(i=0;i<maxD;i++)for(r=0;r<blocks.length;r++)if(i<dc[r].length)data.push(dc[r][i]);
  for(i=0;i<maxE;i++)for(r=0;r<blocks.length;r++)if(i<ecd[r].length)data.push(ecd[r][i]);
  return data;
 }
 function probe(m,row,col){
  var n=m.length;
  for(var r=-1;r<=7;r++){
   if(row+r<=-1||n<=row+r)continue;
   for(var c=-1;c<=7;c++){
    if(col+c<=-1||n<=col+c)continue;
    m[row+r][col+c]=((0<=r&&r<=6&&(c===0||c===6))||(0<=c&&c<=6&&(r===0||r===6))||(2<=r&&r<=4&&2<=c&&c<=4));
   }
  }
 }
 function mapData(m,data,mask){
  var n=m.length,inc=-1,row=n-1,bitIdx=7,byteIdx=0;
  for(var col=n-1;col>0;col-=2){
   if(col===6)col--;
   for(;;){
    for(var c=0;c<2;c++){
     if(m[row][col-c]===null){
      var dark=false;
      if(byteIdx<data.length)dark=(((data[byteIdx]>>>bitIdx)&1)===1);
      if(maskFn(mask,row,col-c))dark=!dark;
      m[row][col-c]=dark;
      bitIdx--;
      if(bitIdx===-1){byteIdx++;bitIdx=7;}
     }
    }
    row+=inc;
    if(row<0||n<=row){row-=inc;inc=-inc;break;}
   }
  }
 }
 function build(ver,ec,mask,data){
  var n=ver*4+17,m=[],r,c,i,j;
  for(r=0;r<n;r++){m[r]=[];for(c=0;c<n;c++)m[r][c]=null;}
  probe(m,0,0);probe(m,n-7,0);probe(m,0,n-7);
  var pos=ALIGN[ver-1];
  for(i=0;i<pos.length;i++)for(j=0;j<pos.length;j++){
   var pr=pos[i],pc=pos[j];
   if(m[pr][pc]!==null)continue;
   for(r=-2;r<=2;r++)for(c=-2;c<=2;c++)
    m[pr+r][pc+c]=(r===-2||r===2||c===-2||c===2||(r===0&&c===0));
  }
  for(i=8;i<n-8;i++){
   if(m[i][6]===null)m[i][6]=(i%2===0);
   if(m[6][i]===null)m[6][i]=(i%2===0);
  }
  var bits=bchInfo((ECBIT[ec]<<3)|mask);
  for(i=0;i<15;i++){
   var md=((bits>>i)&1)===1;
   if(i<6)m[i][8]=md;else if(i<8)m[i+1][8]=md;else m[n-15+i][8]=md;
  }
  for(i=0;i<15;i++){
   var md2=((bits>>i)&1)===1;
   if(i<8)m[8][n-i-1]=md2;else if(i<9)m[8][15-i-1+1]=md2;else m[8][15-i-1]=md2;
  }
  m[n-8][8]=true;
  if(ver>=7){
   var bv=bchVer(ver);
   for(i=0;i<18;i++){
    var md3=((bv>>i)&1)===1;
    m[Math.floor(i/3)][i%3+n-8-3]=md3;
    m[i%3+n-8-3][Math.floor(i/3)]=md3;
   }
  }
  mapData(m,data,mask);
  return m;
 }
 function lost(m){
  var n=m.length,L=0,row,col,r,c;
  for(row=0;row<n;row++)for(col=0;col<n;col++){
   var same=0,dk=m[row][col];
   for(r=-1;r<=1;r++){
    if(row+r<0||n<=row+r)continue;
    for(c=-1;c<=1;c++){
     if(col+c<0||n<=col+c)continue;
     if(r===0&&c===0)continue;
     if(dk===m[row+r][col+c])same++;
    }
   }
   if(same>5)L+=(3+same-5);
  }
  for(row=0;row<n-1;row++)for(col=0;col<n-1;col++){
   var k=0;
   if(m[row][col])k++;if(m[row+1][col])k++;if(m[row][col+1])k++;if(m[row+1][col+1])k++;
   if(k===0||k===4)L+=3;
  }
  for(row=0;row<n;row++)for(col=0;col<n-6;col++)
   if(m[row][col]&&!m[row][col+1]&&m[row][col+2]&&m[row][col+3]&&m[row][col+4]&&!m[row][col+5]&&m[row][col+6])L+=40;
  for(col=0;col<n;col++)for(row=0;row<n-6;row++)
   if(m[row][col]&&!m[row+1][col]&&m[row+2][col]&&m[row+3][col]&&m[row+4][col]&&!m[row+5][col]&&m[row+6][col])L+=40;
  var dark=0;
  for(col=0;col<n;col++)for(row=0;row<n;row++)if(m[row][col])dark++;
  L+=Math.abs(100*dark/n/n-50)/5*10;
  return L;
 }
 function make(text,ec){
  ec=ec||'M';
  var bytes=utf8(text),ver=0;
  for(var v=1;v<=15;v++){
   var bs=blocksOf(v,ec),tot=0;
   for(var i=0;i<bs.length;i++)tot+=bs[i].data;
   if(4+(v<10?8:16)+bytes.length*8<=tot*8){ver=v;break;}
  }
  if(!ver)throw new Error('data too long');
  var data=createData(ver,ec,bytes);
  var best=null,bs2=Infinity;
  for(var k=0;k<8;k++){
   var mm=build(ver,ec,k,data),p=lost(mm);
   if(p<bs2){bs2=p;best=mm;}
  }
  return best;
 }
 return {make:make};
})();
function drawQR(cv,text,target){
 if(!cv)return false;
 var m=null;
 try{m=QR.make(text,'M');}catch(e){try{m=QR.make(text,'L');}catch(e2){return false;}}
 var n=m.length,q=4,t=n+q*2;
 var sc=Math.max(3,Math.floor((target||300)/t));
 var px=t*sc;
 cv.width=px;cv.height=px;cv.style.width=px+'px';cv.style.height=px+'px';
 var x=cv.getContext('2d');
 x.fillStyle='#FFFFFF';x.fillRect(0,0,px,px);
 x.fillStyle='#000000';

}

var PP_AID='A000000677010111';           /* 16 ตัวอักษร — ห้ามพิมพ์ผิด */
function crc16(s){
 var c=0xFFFF;
 for(var i=0;i<s.length;i++){
  c^=s.charCodeAt(i)<<8;
  for(var j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;
 }
 return (c&0xFFFF).toString(16).toUpperCase().padStart(4,'0');
}
function tlv(id,val){return id+String(val.length).padStart(2,'0')+val;}
function ppTarget(id){
 var t=(id||'').replace(/\D/g,'');
 if(t.length===15)return {tag:'03',val:t,label:'e-Wallet 15 หลัก'};
 if(t.length===13)return {tag:'02',val:t,label:'เลขบัตร/นิติบุคคล 13 หลัก'};
 if(t.length===11&&t.slice(0,2)==='66')return {tag:'01',val:'0066'+t.slice(2),label:'เบอร์มือถือ'};
 if(t.length===12&&t.slice(0,2)==='66')return {tag:'01',val:'00'+t,label:'เบอร์มือถือ'};
 if(t.length===10&&t.charAt(0)==='0')return {tag:'01',val:'0066'+t.slice(1),label:'เบอร์มือถือ'};
 if(t.length===9)return {tag:'01',val:'0066'+t,label:'เบอร์มือถือ'};
 return null;
}
function ppPayload(id,amt){
 var tg=ppTarget(id);
 if(!tg)return '';
 var merchant=tlv('29',tlv('00',PP_AID)+tlv(tg.tag,tg.val));
 var p='000201'
      +tlv('01',amt>0?'12':'11')
      +merchant
      +tlv('58','TH')
      +tlv('53','764');
 if(amt>0)p+=tlv('54',(+amt).toFixed(2));
 p+='6304';
 return p+crc16(p);
}

function ppDebug(p){

 var NAME={'00':'Payload Format','01':'POI Method','29':'PromptPay','53':'สกุลเงิน (764=THB)',
  '54':'จำนวนเงิน','58':'ประเทศ','63':'CRC'};
 while(i<p.length-3){
  var id=p.substr(i,2),len=parseInt(p.substr(i+2,2),10);
  if(isNaN(len))break;
  var v=p.substr(i+4,len);
  out.push('<tr><td><b>'+id+'</b></td><td>'+(NAME[id]||'-')+'</td><td>'+len+'</td><td style="word-break:break-all">'+v+'</td></tr>');
  i+=4+len;
 }

}

 if(!DB.shop.promptpay)return toast('ยังไม่ได้ตั้งเบอร์พร้อมเพย์ในแท็บ ⚙️ ตั้งค่าร้าน');
 const pay=ppPayload(DB.shop.promptpay,k.total);
 if(!pay)return toast('รูปแบบพร้อมเพย์ไม่ถูกต้อง');
 openModal('รับชำระ — QR พร้อมเพย์',
  '<div style="text-align:center"><div class="qrbox">'+
  '<div class="hd">THAI QR PAYMENT</div>'+
  '<div class="bl"><canvas id="qrc"></canvas></div>'+
  '<div style="padding:10px"><div style="font-weight:800">'+(DB.shop.ppName||DB.shop.name)+'</div>'+
  '<div style="color:var(--muted);font-size:13px">พร้อมเพย์ '+DB.shop.promptpay+'</div>'+
  '<div style="font-size:34px;font-weight:800;color:var(--brown-d);margin-top:4px">฿'+B(k.total)+'</div></div></div>'+
  '<div id="qrErr"></div>'+
  '<div style="font-size:11px;color:var(--muted);word-break:break-all;margin-top:10px">'+pay+'</div>'+
  '<div class="f2" style="margin-top:12px"><button class="btn gh" onclick="saveQRImg()">⬇️ บันทึกรูป QR</button>'+
  '<button class="btn qr" onclick="doPay(\'พร้อมเพย์\')">✅ ลูกค้าโอนแล้ว</button></div></div>');
 if(!drawQR($('qrc'),pay,300))
  $('qrErr').innerHTML='<div class="box" style="background:#FBE9E7;border-color:#F3C4BE;margin-top:10px">สร้าง QR ไม่สำเร็จ กรุณาตรวจเลขพร้อมเพย์</div>';
}
function saveQRImg(){
 const cv=$('qrc')||$('qrt');if(!cv)return;
 const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='promptpay_qr.png';a.click();}
function nextBill(){const s=DB.shop,d=new Date();
 const dt=s.billDate?(''+d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-':'';
 return (s.billPrefix||'')+dt+String(s.billNext||1).padStart(s.billDigits||4,'0');}
function doPay(method){
 const k=calc(),ni=needIng();let cost=0;
 Object.keys(ni.need).forEach(id=>{const g=ingOf(id);if(g){g.qty=+(g.qty-ni.need[id]).toFixed(3);cost+=ni.need[id]*g.cost;}});
 const sale={id:nextBill(),t:new Date().toISOString(),items:cart.map(c=>Object.assign({},c)),
  sub:k.sub,disc:k.disc,free:k.free,total:k.total,cost:+cost.toFixed(2),method:method,mem:curMem?curMem.phone:''};
 DB.shop.billNext=(DB.shop.billNext||1)+1;DB.sale.push(sale);
 if(curMem){const m=DB.mem.find(x=>x.phone===curMem.phone);
  m.stamp=m.stamp-k.free*k.need+(k.cups-k.free);m.spend+=k.total;m.cups+=k.cups;m.last=today();curMem=m;}
 save();
 const low=DB.ing.filter(i=>i.qty<=i.min);
 closeModal();
 openModal('ชำระเงินสำเร็จ ✅',
  '<div style="text-align:center;padding:8px 0"><div style="font-size:54px">☕</div>'+
  '<div style="font-size:24px;font-weight:800;color:var(--ok)">รับเงินเรียบร้อย</div>'+
  '<div style="color:var(--muted)">'+sale.id+' · '+method+' · ฿'+B(k.total)+'</div>'+
  (k.free?'<div class="pill ok" style="margin-top:8px">ใช้สิทธิ์ฟรี '+k.free+' แก้ว</div>':'')+
  (curMem?'<div style="margin-top:8px">แต้มคงเหลือ '+curMem.phone+': <b>'+curMem.stamp+'</b> ดวง</div>':'')+
  (low.length?'<div class="box" style="background:#FCF0DC;border-color:#EBD6A9;margin-top:12px;text-align:left"><b class="pill warn">⚠️ สต็อกใกล้หมด</b><br>'+low.map(i=>i.name+' เหลือ '+N(i.qty)+' '+i.unit).join('<br>')+'</div>':'')+
  '<div class="f2" style="margin-top:14px"><button class="btn cash" onclick="bill(\''+sale.id+'\',\'cus\')">🧾 บิลลูกค้า</button>'+
  '<button class="btn gh" onclick="bill(\''+sale.id+'\',\'kit\')">📝 บิลออเดอร์ร้าน</button></div>'+
  '<button class="btn gh" style="width:100%;margin-top:8px" onclick="newOrder()">เริ่มออเดอร์ใหม่</button></div>');
 renderNav();}
function newOrder(){cart=[];curMem=null;$('memPhone').value='';showMem();closeModal();renderPOS();}

 return '<div class="c b big">** ออเดอร์ร้าน **</div><div class="c">'+sh.name+' · '+sh.branch+'</div>'+

   return '<div class="b big">'+i.name+' ('+TYPE[i.type]+') ×'+i.qty+'</div><div class="s">หวาน '+i.sweet+'%'+(i.note?' · '+i.note:'')+'</div>'+

  '<div class="hr"></div><div class="c s">รวม '+s.items.reduce((a,b)=>a+b.qty,0)+' แก้ว · ต้นทุนรวม ฿'+B(s.cost)+'</div>';}
function bill(id,mode){
 const s=DB.sale.find(x=>x.id===id);if(!s)return;
 openModal(mode==='cus'?'บิลลูกค้า':'บิลออเดอร์ร้าน (สูตรชง)',
  '<div class="slip" id="slip">'+slipHTML(s,mode)+'<div class="c s" style="margin-top:8px">— '+(mode==='cus'?'ใบเสร็จรับเงิน':'สำหรับบาริสต้า')+' —</div></div>'+
  '<div class="f2" style="margin-top:14px"><button class="btn cash" onclick="printSlip()">🖨 พิมพ์</button>'+
  '<button class="btn gh" onclick="bill(\''+id+'\',\''+(mode==='cus'?'kit':'cus')+'\')">สลับเป็น'+(mode==='cus'?'บิลร้าน':'บิลลูกค้า')+'</button></div>');}
function printSlip(){
 const html='<html><head><meta charset="utf-8"><style>body{font-family:"Noto Sans Thai",-apple-system,sans-serif;width:300px;margin:0 auto;padding:10px;font-size:13px;color:#000}'+
 '.c{text-align:center}.b{font-weight:800}.big{font-size:16px}.s{font-size:11px;color:#333}.hr{border-top:1px dashed #000;margin:7px 0}'+
 '.ln{display:flex;justify-content:space-between;gap:8px;margin:3px 0}@page{margin:4mm}</style></head><body>'+$('slip').innerHTML+'</body></html>';
 let f=$('prnf');if(f)f.remove();
 f=document.createElement('iframe');f.id='prnf';f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
 document.body.appendChild(f);const d=f.contentWindow.document;d.open();d.write(html);d.close();
 setTimeout(()=>{f.contentWindow.focus();f.contentWindow.print();},400);}

let IMG='';

 '<label class="f">รูปประกอบ</label><div style="display:flex;gap:10px;align-items:center">'+

 '<input type="file" accept="image/*" onchange="upImg(this)" style="flex:1">'+

 '<label class="f">ประเภท & ราคา</label>'+
 Object.keys(TYPE).map(t=>'<div class="rowl"><label style="width:140px;display:flex;gap:8px;align-items:center">'+
  '<input type="checkbox" id="t_'+t+'" '+(m.types[t]&&m.types[t].on?'checked':'')+' style="width:20px;height:20px"> '+TYPE[t]+'</label>'+
  '<input type="number" id="p_'+t+'" value="'+((m.types[t]&&m.types[t].price)||0)+'" placeholder="ราคา"></div>').join('')+
 '<label class="f">ระดับความหวานที่ให้เลือก (คั่นด้วย , )</label><input id="eSweet" value="'+(m.sweets||[100]).join(',')+'">'+
 '<div class="f2" style="margin-top:18px"><button class="btn cash" onclick="saveMenu(\''+(m.id||'')+'\')">💾 บันทึก</button>'+
 (id?'<button class="btn dan" onclick="delMenu(\''+id+'\')">🗑 ลบเมนูนี้</button>':'<span></span>')+'</div>',true);}
function upImg(el){const f=el.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),M=420;
  const s=Math.min(M/im.width,M/im.height,1);c.width=im.width*s;c.height=im.height*s;
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);IMG=c.toDataURL('image/jpeg',.78);
  $('ePrev').innerHTML='<img src="'+IMG+'" style="width:100%;height:100%;object-fit:cover">';};im.src=e.target.result;};
 r.readAsDataURL(f);}
function saveMenu(id){
 const name=$('eName').value.trim();if(!name)return toast('ใส่ชื่อเมนู');
 const o=id?menuOf(id):{id:uid(),rec:{},types:{}};
 o.name=name;o.cat=$('eCat').value.trim()||'อื่นๆ';o.emoji=$('eEmoji').value.trim()||'☕';o.img=IMG;o.on=$('eOn').value==='1';
 o.types=o.types||{};Object.keys(TYPE).forEach(t=>o.types[t]={on:$('t_'+t).checked,price:+$('p_'+t).value||0});
 const sw=$('eSweet').value.split(',').map(x=>+x.trim()).filter(x=>!isNaN(x));
 o.sweets=sw.length?sw:[100];o.rec=o.rec||{};
 if(!id)DB.menu.push(o);save();closeModal();renderMenuPage();toast('บันทึกเมนูแล้ว ✅');}
function delMenu(id){if(!confirm('ลบเมนูนี้ถาวร?'))return;DB.menu=DB.menu.filter(m=>m.id!==id);save();closeModal();renderMenuPage();}
function editRec(id,t,s){
 const m=menuOf(id),ts=Object.keys(TYPE).filter(k=>m.types[k]&&m.types[k].on);
 t=t||ts[0]||'hot';const sw=m.sweets&&m.sweets.length?m.sweets:[100];
 s=(s===undefined||s===null)?(sw.indexOf(100)>=0?100:sw[0]):+s;
 const key=RK(t,s),rows=m.rec[key]||[];
 const cost=rows.reduce((a,r)=>{const g=ingOf(r.ing);return a+(g?g.cost*r.qty:0);},0);
 const pr=(m.types[t]&&m.types[t].price)||0;
 openModal('สูตรชง: '+m.name,
 '<label class="f">ประเภท</label><div class="opts">'+ts.map(k=>'<button class="chip '+(k===t?'on':'')+'" onclick="editRec(\''+id+'\',\''+k+'\','+s+')">'+TYPE[k]+'</button>').join('')+'</div>'+
 '<label class="f">ระดับความหวาน (สูตรแยกกันแต่ละระดับ)</label><div class="opts">'+
 sw.map(v=>'<button class="chip '+(v===s?'on':'')+(m.rec[RK(t,v)]?'':' miss')+'" onclick="editRec(\''+id+'\',\''+t+'\','+v+')">'+v+'%</button>').join('')+'</div>'+
 '<table style="margin-top:12px"><thead><tr><th>วัตถุดิบ</th><th style="width:120px">ปริมาณ</th><th class="r" style="width:86px">ต้นทุน</th><th style="width:44px"></th></tr></thead><tbody>'+
 (rows.length?rows.map((r,i)=>{const g=ingOf(r.ing)||{name:'?',unit:'',cost:0};
  return '<tr><td><select onchange="setRec(\''+id+'\',\''+key+'\','+i+',\'ing\',this.value)">'+
  DB.ing.map(x=>'<option value="'+x.id+'" '+(x.id===r.ing?'selected':'')+'>'+x.name+'</option>').join('')+'</select></td>'+
  '<td><input type="number" step="0.1" value="'+r.qty+'" onchange="setRec(\''+id+'\',\''+key+'\','+i+',\'qty\',this.value)">'+
  '<div style="font-size:11px;color:var(--muted);text-align:center">'+g.unit+'</div></td>'+
  '<td class="r">฿'+B(g.cost*r.qty)+'</td>'+
  '<td><button class="btn dan sm" onclick="delRec(\''+id+'\',\''+key+'\','+i+')">✕</button></td></tr>';}).join('')
  :'<tr><td colspan="4" class="empty">ยังไม่มีสูตรสำหรับ '+TYPE[t]+' '+s+'%</td></tr>')+'</tbody></table>'+
 '<div class="bar" style="margin-top:10px"><button class="btn gh sm" onclick="addRec(\''+id+'\',\''+key+'\')">➕ เพิ่มวัตถุดิบ</button>'+
 '<button class="btn gh sm" onclick="copyAll(\''+id+'\',\''+t+'\','+s+')">📑 คัดลอกไปทุกความหวาน</button>'+
 '<button class="btn gh sm" onclick="copyFrom(\''+id+'\',\''+t+'\','+s+')">⬅️ คัดลอกจากระดับอื่น</button></div>'+
 '<div class="box" style="background:#F6F0EA"><div class="tot"><span>ต้นทุนต่อแก้ว ('+TYPE[t]+' '+s+'%)</span><b>฿'+B(cost)+'</b></div>'+
 '<div class="tot"><span>ราคาขาย</span><b>฿'+B(pr)+'</b></div>'+
 '<div class="tot big"><span>กำไร/แก้ว</span><span>฿'+B(pr-cost)+' <span style="font-size:14px">('+(pr?Math.round((pr-cost)/pr*100):0)+'%)</span></span></div></div>',true);}
function addRec(id,key){const m=menuOf(id);if(!DB.ing.length)return toast('เพิ่มวัตถุดิบในแท็บสต็อกก่อน');
 m.rec[key]=m.rec[key]||[];m.rec[key].push({ing:DB.ing[0].id,qty:1});save();
 const p=key.split('|');editRec(id,p[0],+p[1]);}
function setRec(id,key,i,k,v){const r=menuOf(id).rec[key][i];r[k]=k==='qty'?+v:v;save();
 const p=key.split('|');editRec(id,p[0],+p[1]);}
function delRec(id,key,i){const m=menuOf(id);m.rec[key].splice(i,1);if(!m.rec[key].length)delete m.rec[key];save();
 const p=key.split('|');editRec(id,p[0],+p[1]);}
function copyAll(id,t,s){const m=menuOf(id),src=m.rec[RK(t,s)];if(!src)return toast('สูตรต้นทางว่าง');
 if(!confirm('คัดลอกสูตร '+TYPE[t]+' '+s+'% ไปทุกระดับความหวาน?'))return;
 m.sweets.forEach(v=>{m.rec[RK(t,v)]=src.map(x=>({ing:x.ing,qty:x.qty}));});save();editRec(id,t,s);toast('คัดลอกแล้ว');}
function copyFrom(id,t,s){const m=menuOf(id);
 const src=Object.keys(m.rec).filter(k=>k!==RK(t,s));
 if(!src.length)return toast('ยังไม่มีสูตรอื่น');
 openModal('คัดลอกสูตรมาที่ '+TYPE[t]+' '+s+'%',
  src.map(k=>{const p=k.split('|');return '<button class="btn gh" style="width:100%;margin-bottom:8px" onclick="doCopy(\''+id+'\',\''+k+'\',\''+RK(t,s)+'\')">'+TYPE[p[0]]+' · หวาน '+p[1]+'% ('+m.rec[k].length+' รายการ)</button>';}).join(''));}
function doCopy(id,from,to){const m=menuOf(id);m.rec[to]=m.rec[from].map(x=>({ing:x.ing,qty:x.qty}));save();
 const p=to.split('|');editRec(id,p[0],+p[1]);toast('คัดลอกแล้ว ✅');}

 '<div class="f2"><div class="box"><b>🏆 เมนูขายดี</b><table style="margin-top:8px"><thead><tr><th>เมนู</th><th class="r">แก้ว</th><th class="r">ยอด</th></tr></thead><tbody>'+
 (top.length?top.slice(0,10).map((t,i)=>'<tr><td>'+(['🥇','🥈','🥉'][i]||(i+1)+'.')+' '+t[0]+'</td><td class="r"><b>'+t[1].q+'</b></td><td class="r">฿'+B(t[1].v)+'</td></tr>').join(''):'<tr><td colspan="3" class="empty">ไม่มีข้อมูล</td></tr>')+
 '</tbody></table></div>'+

 bar('c1',days,'#6F4E37');
 const hrs=[];for(let i=7;i<=23;i++)hrs.push([i+':00',byHr[i]||0]);
 bar('c2',hrs,'#A9836A');}
function bar(id,data,color){
 const cv=$(id);if(!cv||!data.length)return;
 const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.height;
 cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
 x.clearRect(0,0,W,H);
 const pl=58,pr=10,pt=18,pb=34,cw=W-pl-pr,ch=H-pt-pb;
 const max=Math.max(1,Math.max.apply(null,data.map(d=>d[1])));
 x.font='11px -apple-system,sans-serif';
 for(let i=0;i<=4;i++){const y=pt+ch-ch*i/4;
  x.strokeStyle='#E6DCD2';x.beginPath();x.moveTo(pl,y);x.lineTo(W-pr,y);x.stroke();
  x.fillStyle='#8A7E74';x.textAlign='right';x.fillText('฿'+Math.round(max*i/4).toLocaleString(),pl-8,y+4);}
 const bw=cw/data.length,w=Math.min(46,bw*.66);
 data.forEach((d,i)=>{const h=ch*d[1]/max,cx=pl+bw*i+bw/2,y=pt+ch-h;
  const g=x.createLinearGradient(0,y,0,pt+ch);g.addColorStop(0,color);g.addColorStop(1,color+'88');
  x.fillStyle=g;x.beginPath();
  if(x.roundRect)x.roundRect(cx-w/2,y,w,h,[6,6,0,0]);else x.rect(cx-w/2,y,w,h);
  x.fill();
  x.fillStyle='#8A7E74';x.textAlign='center';
  if(data.length<=18||i%Math.ceil(data.length/12)===0)x.fillText(d[0],cx,pt+ch+16);
  if(d[1]>0&&data.length<=18){x.fillStyle='#3E2B21';x.font='bold 11px sans-serif';
   x.fillText(Math.round(d[1]).toLocaleString(),cx,y-5);x.font='11px sans-serif';}});}
function csv(){
 const rows=[['เลขที่บิล','วันเวลา','เมนู','ประเภท','หวาน%','จำนวน','ราคา/แก้ว','รวม','ส่วนลด','สุทธิบิล','ต้นทุนบิล','ชำระ','เบอร์สมาชิก']];
 salesIn().forEach(s=>s.items.forEach(i=>rows.push([s.id,new Date(s.t).toLocaleString('th-TH'),i.name,TYPE[i.type],i.sweet,i.qty,i.price,i.price*i.qty,s.disc,s.total,s.cost,s.method,s.mem])));
 const blob=new Blob(['\uFEFF'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sales_'+R1+'_'+R2+'.csv';a.click();}

 '<div class="f2"><div><label class="f">สะสมกี่แก้ว แถม 1 แก้ว</label><input id="sNeed" type="number" value="'+(s.stampNeed||10)+'"></div>'+
 '<div><label class="f">แก้วที่ได้ฟรี</label><select id="sRule">'+
 '<option value="high" '+(s.freeRule!=='low'?'selected':'')+'>แก้วราคาสูงสุดในบิล</option>'+
 '<option value="low" '+(s.freeRule==='low'?'selected':'')+'>แก้วราคาต่ำสุดในบิล</option></select></div></div></div>'+
 '<button class="btn cash" style="width:100%" onclick="saveShop()">💾 บันทึกการตั้งค่าทั้งหมด</button>'+
 '<div class="box" style="margin-top:14px"><b>💾 ข้อมูลระบบ</b>'+
 '<div style="font-size:13px;color:var(--muted);margin:8px 0">เมนู '+DB.menu.length+' · วัตถุดิบ '+DB.ing.length+' · สมาชิก '+DB.mem.length+' · บิล '+DB.sale.length+'</div>'+
 '<div class="f3"><button class="btn gh sm" onclick="backup()">⬇️ สำรองข้อมูล</button>'+
 '<label class="btn gh sm" style="text-align:center">⬆️ กู้คืนข้อมูล<input type="file" accept=".json" onchange="restore(this)" hidden></label>'+
 '<button class="btn dan sm" onclick="if(confirm(\'ล้างข้อมูลทั้งหมด?\')){localStorage.removeItem(LS);location.reload()}">🗑 รีเซ็ตระบบ</button></div></div>';}
function testQR(){
 const pp=$('sPP').value.trim();if(!pp)return toast('ใส่เบอร์พร้อมเพย์ก่อน');
 const tg=ppTarget(pp);
 if(!tg)return toast('รูปแบบไม่ถูกต้อง (ต้องเป็น 10 / 13 / 15 หลัก)');
 const p=ppPayload(pp,10);
 openModal('ทดสอบ QR พร้อมเพย์ 10 บาท',
  '<div style="text-align:center"><canvas id="qrt"></canvas><div id="qrte"></div></div>'+
  '<div class="box" style="margin-top:12px"><b>ประเภทที่ตรวจพบ:</b> '+tg.label+' → Tag '+tg.tag+'<br>'+
  '<b>ค่าที่ส่ง:</b> '+tg.val+'</div>'+
  '<div class="box">'+ppDebug(p)+'</div>'+
  '<div style="font-size:11px;color:var(--muted);word-break:break-all">'+p+'</div>'+
  '<button class="btn gh" style="width:100%;margin-top:10px" onclick="saveQRImg()">⬇️ บันทึกรูป QR</button>');
 if(!drawQR($('qrt'),p,300))$('qrte').innerHTML='<div class="pill bad">สร้าง QR ไม่สำเร็จ</div>';}
function saveShop(){
 const s=DB.shop;
 s.name=$('sName').value.trim()||'ร้านกาแฟ';s.branch=$('sBranch').value.trim();s.addr=$('sAddr').value.trim();
 s.phone=$('sPhone').value.trim();s.taxid=$('sTax').value.trim();s.footer=$('sFoot').value.trim();
 s.promptpay=$('sPP').value.trim();s.ppName=$('sPN').value.trim();
 s.billPrefix=$('sPre').value.trim();s.billNext=+$('sNext').value||1;s.billDigits=+$('sDig').value||4;s.billDate=$('sDate').checked;
 s.stampNeed=+$('sNeed').value||10;s.freeRule=$('sRule').value;
 save();head();renderSetting();toast('บันทึกการตั้งค่าแล้ว ✅');}
function backup(){const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));
 a.download='pos_backup_'+today()+'.json';a.click();}
function restore(el){const f=el.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.shop)throw 0;DB=d;save();location.reload();}catch(x){toast('ไฟล์ไม่ถูกต้อง');}};
 r.readAsText(f);}

head();renderNav();renderPOS();showMem();
if(lowCount())setTimeout(()=>toast('⚠️ มีวัตถุดิบใกล้หมด '+lowCount()+' รายการ'),900);
</script>
